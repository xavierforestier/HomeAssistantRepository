name: function Search for update available upstream
on:
  workflow_call:
    inputs:
      upstream:
        description: 'Upstream URL'
        required: true
        type: string
      pkgName:
        description: 'Gentoo package'
        required: true
        type: string
      pkgCategory:
        description: 'Gentoo category'
        required: true
        type: string
jobs:
  check_upstream:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xavierforestier/gentoo-ci-ha-pytorch:main
      options: --privileged
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup HomeAssistant repository     
      run: |
        rsync -aHDPSv etc/portage/ /etc/portage/
        echo -n "location = " >> /etc/portage/repos.conf/homeassistant.conf
        pwd -P >> /etc/portage/repos.conf/homeassistant.conf
        git config --global --add safe.directory '*'
        git config --local user.name "xavier.forestier"
        git config --local user.email "23277701+xavierforestier@users.noreply.github.com"
        
    - name: Is last upstream version already known
      id: latest_version
      run: |
        latest_release=$( wget -qO - "https://api.github.com/repos/${{ inputs.upstream }}/releases/latest" | jq -r '.tag_name' )
        if [ -n "${latest_release}" ] && [ ! -e "./${{ inputs.pkgCategory }}/${{ inputs.pkgName }}/${{ inputs.pkgName }}-${latest_release}.ebuild" ]; then
          git switch -c "feature/${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release}" 
          git push --set-upstream origin "feature/${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release}"
          emerge -q app-portage/eix
          emerge --regen
          eix-update
          case "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" in
            app-misc/homeassistant)
              cp "$(find app-misc/homeassistant/files/ge*.patch | sort -rV | head -n1)" "app-misc/homeassistant/files/genebuild_${version}.patch"
              ./scripts/genebuild.sh -dm "${latest_release}"
              ./scripts/generate-missing-deps.sh "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" build
              git push
              ;;
            *) 
              ./scripts/generate-missing-deps.sh "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" upgrade "${latest_release}"
              ./scripts/generate-missing-deps.sh "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" build
              git push
              ;;
          esac
          echo "pr_branch=feature/${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release}" >> $GITHUB_OUTPUT
        else
          echo "pr_branch=''" >> $GITHUB_OUTPUT
        fi
        
    - uses: peter-evans/create-pull-request@v8.1.1
      if: ${{ steps.latest_version.outputs.pr_branch }} != ''
      with:
        title: Autogenerate deps ${{ steps.latest_version.outputs.pr_branch }}
        
