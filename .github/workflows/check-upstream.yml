name: function Search for update available upstream
on:
  workflow_call:
    inputs:
      upstream:
        description: 'Upstream URL'
        required: true
        type: string
      pkgName:
        description: 'Gentoo package'
        required: true
        type: string
      pkgCategory:
        description: 'Gentoo category'
        required: true
        type: string
jobs:
  check_upstream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Is last upstream version already known
      id: latest_version
      run: |
        latest_release=$( wget -qO - "https://api.github.com/repos/${{ inputs.upstream }}/releases/latest" | jq -r '.tag_name' )
        if [ -n "${latest_release}" ] && [ ! -e "./${{ inputs.pkgCategory }}/${{ inputs.pkgName }}/${{ inputs.pkgName }}-${latest_release}.ebuild" ]; then
          git switch -c "feature/${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release}" 
          git push --set-upstream origin "feature/${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release}"
          case "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" in
            app-misc/homeassistant)
              cp "$(find app-misc/homeassistant/files/ge*.patch | sort -rV | head -n1)" "app-misc/homeassistant/files/genebuild_${version}.patch"
              ./scripts/genebuild.sh -dm "${latest_release}"
              ;;
            *) 
              ./scripts/generate-missing-deps.sh "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" upgrade "${latest_release}"
              ./scripts/generate-missing-deps.sh "${{ inputs.pkgCategory }}/${{ inputs.pkgName }}" build
              ;;
          esac
          gh pr create -B "feature/${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release}" -H "master" --title 'Merge ${{ inputs.pkgCategory }}/${{ inputs.pkgName }}-${latest_release} into base_branch'
        fi
